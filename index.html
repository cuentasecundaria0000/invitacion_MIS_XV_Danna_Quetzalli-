<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienes un mensaje estelar</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sobre.css">
</head>
<body>

    <!-- Fondo de estrellas -->
    <div class="sky-background">
        <div class="stars"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <div class="contenedor">

        <!-- Secuencia Lunar -->
       <div class="moon-sequence">
    <div class="moon"><img src="img/fase2.webp" alt="Fase lunar 2"></div>
    <div class="moon"><img src="img/fase3.webp" alt="Fase lunar 3"></div>
    <div class="moon"><img src="img/fase4.webp" alt="Fase lunar 4"></div>
    <div class="moon"><img src="img/fase6.webp" alt="Fase lunar 6"></div>
    <div class="moon"><img src="img/fase7.webp" alt="Fase lunar 7"></div>
    <div class="moon"><img src="img/fase8.webp" alt="Fase lunar 8"></div>
    <div class="moon"><img src="img/fase9.webp" alt="Fase lunar 9"></div>
    </div>

        <!-- SOBRE -->
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
            
            <div class="main-title">MIS XV</div>
            <div class="instruction">Toca el sello para abrir</div>

            <div class="flap"></div>
            <div class="seal">🌙</div>
            
    <div class="letter">
        <div class="letter-border">
            <h2>Te invito a mis XV</h2>
        </div>
    </div>
            
            <div class="envelope-front envelope-front-left"></div>
            <div class="envelope-front envelope-front-right"></div>
            <div class="envelope-front envelope-front-bottom"></div>

        </div>

        <!-- FRASE DEBAJO -->
        <div class="mensaje-extra">
            familia vinagre vázquez ✨
        </div>

    </div>

    <!-- SEGUNDO FONDO (NO LO QUITO, pero lo mando atrás sin estorbar) -->
    <div class="sky-background" style="z-index:-2;">
        <div class="stars"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <!-- CONTENEDOR EXTRA (se mantiene, pero no interfiere) -->
    <div class="contenedor" style="display:none;">
        <!-- Secuencia Lunar -->
    </div>

    <!-- AUDIO -->
    <audio id="backgroundMusic" loop>
        <source src="/img/Luna.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script src="sobre.js"></script>

</body>
</html>
